# 打 tag 即自动发布 GitHub Release，并把 APK 作为附件挂上去。
#
# 为什么需要它：App 内的在线更新走 jsDelivr + raw 两个源（实测设备侧 github.com
# 被阻断，所以不能用 releases/download 那类地址）。也就是说 Release 不是更新链路的
# 必要条件。但 Release 是给「人」看的 —— 别人来到仓库想下载安装包时，
# 光有 tag 的 source code 是拿不到 APK 的。
#
# 不需要配置任何密钥：用的是 GitHub 自动注入的 GITHUB_TOKEN（见下方 permissions）。
#
# 日常发版：push 形如 v* 的 tag 即可，不需要做任何别的事。
#
# ⚠️ 一个实测到的坑（2026-09-23 验证）：push tag 时 GitHub 只会读取**被推送的那个
#    tag 所指提交里**的工作流文件。若 tag 指向一个还没有本文件的旧提交，本工作流
#    **不会触发**（工作流列表里显示 active，但 runs 为 0）。所以：
#    · 新版本照常打 tag 即可（tag 都在 main 上，main 里有本文件）；
#    · 历史版本补建 Release 请用下方「手动补建」。
#
# 手动补建：Actions 页面 → 左侧选 Release → Run workflow → tag 填 all（或留空），
#          它会遍历所有 v* tag，给尚无 Release 的补建。
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "补建 Release 的 tag；留空或填 all = 给所有缺少 Release 的 tag 补建"
        required: false
        default: "all"
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 取出全部历史与 tag
        uses: actions/checkout@v4
        with:
          # 补建模式要逐个 checkout 历史 tag，必须拿全历史
          fetch-depth: 0

      - name: 确定要发布的 tag
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 正常发版：只处理这次推上来的那一个 tag
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tags=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          WANT="${{ github.event.inputs.tag }}"
          if [ -n "$WANT" ] && [ "$WANT" != "all" ]; then
            echo "tags=$WANT" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          LIST=""
          for T in $(git tag -l 'v*'); do
            if gh release view "$T" >/dev/null 2>&1; then
              echo "跳过 $T（已有 Release）"
            else
              LIST="$LIST $T"
            fi
          done
          echo "待补建：${LIST:-无}"
          echo "tags=$LIST" >> "$GITHUB_OUTPUT"

      - name: 逐个校验并发布
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAGS="${{ steps.pick.outputs.tags }}"
          if [ -z "${TAGS// /}" ]; then
            echo "没有需要发布的 tag，结束。"
            exit 0
          fi

          for T in $TAGS; do
            echo "════════════════ $T ════════════════"
            git checkout --force "$T"

            # ── 一切以 dist/update.json 为准（v0.5.3，R10）──
            # 上一版是 `APK="$(ls dist/*.apk | head -1)"` —— 目录里同时留着旧版本时
            # （build.sh 按版本名添加文件、不会删旧的），字典序会取到旧包，与指向新版的
            # 清单 sha/size 不符 → exit 1。失败是 fail-closed（不会发错包），但发版被挡住。
            # 清单里本来就有 `apk` 精确路径，直接读它。
            MF=dist/update.json
            if [ ! -f "$MF" ]; then
              echo "::error::$T 缺少 $MF"
              exit 1
            fi
            APK_REL="$(sed -n 's/.*"apk": *"\([^"]*\)".*/\1/p' "$MF" | head -1)"
            WANT_SHA="$(sed -n 's/.*"sha256": *"\([0-9a-f]\{64\}\)".*/\1/p' "$MF" | head -1)"
            WANT_SIZE="$(sed -n 's/.*"size": *\([0-9][0-9]*\).*/\1/p' "$MF" | head -1)"
            MF_TAG="$(sed -n 's/.*"tag": *"\([^"]*\)".*/\1/p' "$MF" | head -1)"
            MF_VN="$(sed -n 's/.*"versionName": *"\([^"]*\)".*/\1/p' "$MF" | head -1)"
            MF_VC="$(sed -n 's/.*"versionCode": *\([0-9][0-9]*\).*/\1/p' "$MF" | head -1)"
            VN="$(grep -E '^VERSION_NAME=' version.properties | cut -d= -f2- | tr -d ' \r')"
            VC="$(grep -E '^VERSION_CODE=' version.properties | cut -d= -f2- | tr -d ' \r')"
            NOTES="$(grep -E '^NOTES=' version.properties | cut -d= -f2- | tr -d '\r')"

            # ① 路径必须落在 dist/ 内（防清单被写成越界路径），且文件真实存在
            case "$APK_REL" in
              dist/*) ;;
              *) echo "::error::$T 清单里的 apk 路径越界：'$APK_REL'"; exit 1 ;;
            esac
            if [ ! -f "$APK_REL" ]; then
              echo "::error::$T 清单指向的 APK 不存在：$APK_REL"
              exit 1
            fi
            APK="$APK_REL"

            # ② tag 与版本号三处必须自洽（清单 / tag / version.properties）
            if [ "$MF_TAG" != "$T" ]; then
              echo "::error::$T 清单里的 tag 是 '$MF_TAG'，与本次发布的 tag 不一致"
              exit 1
            fi
            if [ "$MF_VN" != "$VN" ] || [ "$MF_VC" != "$VC" ]; then
              echo "::error::$T 清单版本 $MF_VN/$MF_VC 与 version.properties 的 $VN/$VC 不一致"
              exit 1
            fi

            # ③ 逐字节核对（清单必须与 APK 同批生成 —— APK 构建是非确定性的）
            GOT_SHA="$(sha256sum "$APK" | cut -d' ' -f1)"
            GOT_SIZE="$(wc -c < "$APK" | tr -d ' \r\n')"
            echo "APK        : $APK"
            echo "清单 sha256: $WANT_SHA"
            echo "实际 sha256: $GOT_SHA"
            echo "清单 size  : $WANT_SIZE"
            echo "实际 size  : $GOT_SIZE"
            if [ "$WANT_SHA" != "$GOT_SHA" ]; then
              echo "::error::$T 的 APK sha256 与 update.json 不一致，拒绝发布"
              exit 1
            fi
            if [ "$WANT_SIZE" != "$GOT_SIZE" ]; then
              echo "::error::$T 的 APK size 与 update.json 不一致，拒绝发布"
              exit 1
            fi
            echo "校验通过"
            {
              echo "$NOTES"
              echo
              echo "| 项 | 值 |"
              echo "| --- | --- |"
              echo "| 版本 | \`$VN\`（versionCode $VC） |"
              echo "| 安装包 | \`$(basename "$APK")\` |"
              echo "| 体积 | $GOT_SIZE 字节 |"
              echo "| SHA-256 | \`$GOT_SHA\` |"
              echo
              echo "### 怎么装"
              echo
              echo "下载下面的 APK，在设备上允许「安装未知应用」后点开安装。"
              echo
              echo "**已装旧版的不必手动下载** —— App 内「设置 → 版本与更新 → 检查更新」"
              echo "可以一键升级。装了 0.5.0 及以上版本的用户都支持在线更新。"
              echo
              echo "构建与发版流程见 [README](https://github.com/Mosley-Z/WereadMoji#从源码构建)。"
            } > /tmp/release-notes.md

            if gh release view "$T" >/dev/null 2>&1; then
              echo "$T 已有 Release，跳过（如需重建请先在网页上删除）"
              continue
            fi
            gh release create "$T" \
              --title "$T" \
              --notes-file /tmp/release-notes.md \
              "$APK"
            echo "✅ 已创建 Release $T"
          done
