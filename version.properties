# 微读墨记 · 版本号唯一来源
#
# 发版流程：
#   1. 改这里的 VERSION_NAME / VERSION_CODE / NOTES
#   2. bash tools/build.sh
#   3. git add -A && git commit && git push
#   4. 在 GitHub 上给这次提交打 tag：v<VERSION_NAME>（例：v0.5.0）
#
# 为什么要打 tag：App 的下载地址用 tag 引用（jsDelivr / raw 对 tag 是永久缓存、
# 且打 tag 后立刻可用）。若改用分支引用，CDN 缓存会导致新文件读不到。
#
# VERSION_CODE 必须是**递增整数**，App 靠它判断有没有新版。
# 不要改小、不要复用 —— 否则老版本会认为自己比新版本还新，永远收不到更新。
VERSION_NAME=0.5.1
VERSION_CODE=23

# 更新说明：一行短句，发版后会显示在 App 的"检查更新"提示里。
NOTES=修正更新说明：覆盖安装不会清掉无障碍服务，装完即用
